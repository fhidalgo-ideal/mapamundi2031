version: '3.9'

services:
  # MongoDB database service
  db:
    image: mongo:7.0
    container_name: granada-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-granada2031}
      # Setting a root user is what turns authentication on. The defaults below
      # only apply to local development; production values come from the env
      # file on the server, which is not in this repository.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-granada_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-devrootpassword}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-granada2031}
      MONGO_APP_USER: ${MONGO_APP_USER:-granada_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-devapppassword}
    volumes:
      - mongo_data:/data/db
      # Runs once, only when the data directory is empty, to create the
      # least-privilege application user.
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - granada_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API service (Bun server)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: granada-api
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_APP_USER:-granada_app}:${MONGO_APP_PASSWORD:-devapppassword}@db:27017/${MONGO_DB_NAME:-granada2031}?authSource=${MONGO_DB_NAME:-granada2031}}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-granada2031}
      GRANADA_DB_PATH: ${GRANADA_DB_PATH:-/app/data/granada.db}
      GRANADA_UPLOAD_DIR: ${GRANADA_UPLOAD_DIR:-/app/uploads}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - data_data:/app/data
    networks:
      - granada_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        # Code change -> sync into the running container and restart the Bun
        # process (fast, no image rebuild). No manual `docker compose restart`.
        - action: sync+restart
          path: ./api
          target: /app/api
        - action: sync+restart
          path: ./config.json
          target: /app/config.json
        # Dependency change -> only these require a real image rebuild.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock

  # Nginx proxy gateway
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: granada-gateway
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/uploads:ro
    networks:
      - granada_net
    develop:
      watch:
        # Static files -> sync only, nginx re-reads from disk per request.
        - action: sync
          path: ./web
          target: /var/www/html
        - action: sync
          path: ./admin
          target: /var/www/html/admin
        - action: rebuild
          path: ./docker/nginx/default.conf

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  data_data:
    driver: local

networks:
  granada_net:
    driver: bridge
