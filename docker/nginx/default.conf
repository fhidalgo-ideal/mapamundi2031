server {
    listen 80 default_server;
    server_name _;

    # Set a reasonable client body size limit for file uploads
    client_max_body_size 50M;

    # Serve static web content at root
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
        # Cache static assets for 1 hour
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Serve admin panel at /admin/
    location /admin/ {
        alias /var/www/html/admin/;
        index admin.html;
        try_files $uri $uri/ /admin/admin.html;
        # Cache admin assets for 1 hour
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy API requests to the API service
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # Serve uploads volume directly (read-only), no round-trip through API
    location /uploads/ {
        alias /var/www/uploads/;
        # Uploads should be immutable once created
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
