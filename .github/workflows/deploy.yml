name: Deploy

# Deploys to production through the self-hosted runner on that machine. The
# workflow deliberately contains no deployment logic of its own: every step
# lives in scripts/deploy.sh, which is also what you run by hand on the server
# if Actions is unavailable. One procedure, two ways to trigger it.
#
# No secrets are needed or used here. The database credentials live in
# /etc/granada/.env on the server, readable only by root, and never leave it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are serialised and never cancelled halfway: interrupting one between
# the migration and the restart would leave the stack in a state nobody chose.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, granada]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # deploy.sh verifies HEAD is the tip of origin/main, which needs real
          # history rather than the default single-commit checkout.
          fetch-depth: 0

      - name: Deploy
        # No sudo: the runner user is in the docker group, and reads
        # /etc/granada/.env plus writes /var/backups/granada through the
        # granada group.
        run: ./scripts/deploy.sh

      - name: Report
        if: always()
        run: docker compose -p granada ps
