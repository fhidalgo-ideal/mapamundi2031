<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administracion | Granada 2031</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=20260915-12">
  </head>
  <body>
    <header class="topbar" id="topbar">
      <a class="brand" href="/" aria-label="Granada 2031">
        <img class="brand-logo" src="/assets/logo.svg" alt="Granada 2031">
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="topbarNav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="topbar-nav" id="topbarNav">
        <nav aria-label="Navegacion de administracion">
          <a href="/">Ver mapa publico</a>
        </nav>
      </div>
    </header>

    <main class="admin-page">
      <section class="admin-section" aria-labelledby="admin-title">
        <div class="section-heading">
          <p class="eyebrow">Backend protegido</p>
          <h1 id="admin-title">Administracion</h1>
          <p class="admin-intro">Revisa las contribuciones pendientes antes de publicarlas en el mapa.</p>
        </div>
        <form class="admin-login" id="adminLoginForm">
          <label>
            Password de administracion
            <input name="password" type="password" autocomplete="current-password" required placeholder="Password definida en config.json">
          </label>
          <button class="button primary" type="submit">Entrar</button>
          <p id="adminStatus" role="status"></p>
        </form>
        <div class="admin-charts hidden" id="adminCharts">
          <div class="chart-controls">
            <label>
              Desde
              <input type="date" id="chartFrom">
            </label>
            <label>
              Hasta
              <input type="date" id="chartTo">
            </label>
            <div class="chart-toggle" role="group" aria-label="Agrupar por">
              <button type="button" class="chart-toggle-btn active" data-group="country">Pais</button>
              <button type="button" class="chart-toggle-btn" data-group="city">Ciudad</button>
            </div>
          </div>
          <div class="chart-grid">
            <figure class="chart-card">
              <figcaption>Contribuciones por dia</figcaption>
              <div class="chart-body" id="chartByDate"></div>
            </figure>
            <figure class="chart-card">
              <figcaption id="chartByPlaceTitle">Contribuciones por pais</figcaption>
              <div class="chart-body" id="chartByPlace"></div>
            </figure>
          </div>
        </div>
        <div class="admin-layout">
          <div class="metric">
            <strong id="pendingCount">0</strong>
            <span>pendientes</span>
            <button class="text-button hidden" id="adminLogout" type="button">Cerrar sesion</button>
          </div>
          <div class="review-controls">
            <input
              type="search"
              id="reviewSearch"
              class="review-search"
              placeholder="Buscar por nombre, ciudad, pais o email"
              aria-label="Buscar contribuciones"
            >
            <div class="filters" role="group" aria-label="Filtro de estado">
              <button class="chip active" type="button" data-status-filter="all">Todas</button>
              <button class="chip" type="button" data-status-filter="pending">Pendientes</button>
              <button class="chip" type="button" data-status-filter="approved">Aprobadas</button>
              <button class="chip" type="button" data-status-filter="rejected">Rechazadas</button>
            </div>
          </div>
          <div class="review-list" id="reviewList"></div>
        </div>
      </section>
    </main>

    <template id="reviewItemTemplate">
      <article class="review-item">
          <div class="review-photos">
            <img alt="">
            <div class="review-photos-extra hidden"></div>
          </div>
          <div>
          <span class="status-badge"></span>
          <h3></h3>
          <p></p>
          <small></small>
          <form class="edit-form hidden">
            <label class="wide">Sentimiento<textarea name="feeling" required></textarea></label>
            <div class="form-actions wide">
              <button class="button primary save-edit" type="submit">Guardar</button>
              <button class="button ghost cancel-edit" type="button">Cancelar</button>
            </div>
          </form>
        </div>
        <div class="review-actions">
          <button class="button primary approve" type="button">Aprobar</button>
          <button class="button danger reject" type="button">Rechazar</button>
          <button class="button ghost edit" type="button">Editar</button>
          <button class="button danger delete" type="button">Borrar</button>
        </div>
      </article>
    </template>

    <script src="/nav-toggle.js?v=20260915-1"></script>
    <script src="admin.js?v=20260915-1"></script>
  </body>
</html>
