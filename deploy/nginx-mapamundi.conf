# Host nginx vhost for mapamundi.2031granadaideal.es.
#
# The host nginx terminates TLS (it also serves other sites on this machine)
# and proxies to the gateway container, which docker-compose.prod.yml binds to
# 127.0.0.1:8081. Nothing in the stack is published publicly.
#
# Install with:
#   cp deploy/nginx-mapamundi.conf /etc/nginx/sites-available/mapamundi
#   cp deploy/maintenance.html /var/www/maintenance/maintenance.html
#   nginx -t && systemctl reload nginx

server {
    server_name mapamundi.2031granadaideal.es;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # When the stack is down (container stopped, mid-deploy restart, API
        # unhealthy), serve the maintenance page instead of nginx's bare
        # gateway error. proxy_intercept_errors lets the upstream's own 502/503
        # /504 reach the error_page handler too, not just connection failures.
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;
    }

    # No "= 200" on the error_page above, so the original 502/503/504 status is
    # preserved: visitors see the page, crawlers and uptime checks still see a
    # failure rather than a healthy 200.
    location = /maintenance.html {
        root /var/www/maintenance;
        internal;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mapamundi.2031granadaideal.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mapamundi.2031granadaideal.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mapamundi.2031granadaideal.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mapamundi.2031granadaideal.es;
    return 404; # managed by Certbot
}
